<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniList — Model Catalog & Harness Sync</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230070f3'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='23' cy='22' r='2.5' fill='%23ffffff'/%3E%3C/svg%3E">
<script>
  // Default to dark mode; remember the user's explicit choice.
  (function () {
    try {
      var t = localStorage.getItem('omnilist-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<style>
  :root, :root[data-theme="light"] {
    --bg: #fafafa;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --border: #e8e8e8;
    --border-2: #ededed;
    --text: #0a0a0a;
    --text-2: #4b4b4b;
    --text-3: #8b8b8b;
    --accent: #0070f3;
    --accent-weak: #e8f1fe;
    --danger: #e5484d;
    --danger-weak: #fdeaec;
    --success: #30a46c;
    --success-weak: #e9f7f0;
    --warning: #f5a524;
    --warning-weak: #fdf2e3;
    --purple: #8a4baf;
    /* one radius scale: 4/6/8/10/12/20px chaos collapses onto these four */
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-pill: 999px;
    --radius: var(--r-sm);    /* kept: existing rules reference --radius */
    /* one spacing rhythm, 4px base */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 24px; --s-6: 32px; --s-7: 48px;
    /* measure caps */
    --measure: 68ch;
    --measure-page: 1080px;
    /* one elevation scale */
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 18px 48px rgba(0,0,0,.14);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --btn-primary-bg: #000;
    --btn-primary-fg: #fff;
    --btn-primary-hover: #1a1a1a;
    --btn-hover-border: #d4d4d4;
    --danger-border: #f1c0c2;
    --toggle-off: #d0d0d0;
    --toggle-on: #000;
    --toggle-knob: #fff;
    --toggle-knob-on: #fff;
    --bar-bg: rgba(255,255,255,.92);
    --placeholder: #b5b5b5;
    --focus-ring: rgba(0,112,243,.12);
    --invalid-ring: rgba(229,72,77,.12);
    /* theme-aware syntax colours for .expr-preview (was hardcoded dark) */
    --expr-bg: #f5f5f5;
    --expr-fg: #2a2a2a;
    --expr-pfx: #9c2b4e;
    --expr-field: #1a5f8a;
    --expr-str: #1d6b3d;
    --expr-arrow: #8a5a10;
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel-2: #1a1a1a;
    --border: #262626;
    --border-2: #1f1f1f;
    --text: #f4f4f4;
    --text-2: #c4c4c4;
    --text-3: #8a8a8a;
    --accent: #4d9fff;
    --accent-weak: rgba(77,159,255,.16);
    --danger: #ff6369;
    --danger-weak: rgba(255,99,105,.14);
    --success: #3fb68b;
    --success-weak: rgba(63,182,139,.15);
    --warning: #f5a524;
    --warning-weak: rgba(245,165,36,.15);
    --purple: #a78bfa;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,.5);
    --shadow-lg: 0 18px 48px rgba(0,0,0,.6);
    --btn-primary-bg: #fff;
    --btn-primary-fg: #0a0a0a;
    --btn-primary-hover: #e6e6e6;
    --btn-hover-border: #404040;
    --danger-border: rgba(255,99,105,.45);
    --toggle-off: #3a3a3a;
    --toggle-on: #fff;
    --toggle-knob: #fff;
    --toggle-knob-on: #0a0a0a;
    --bar-bg: rgba(17,17,17,.92);
    --placeholder: #5a5a5a;
    --focus-ring: rgba(77,159,255,.25);
    --invalid-ring: rgba(255,99,105,.25);
    --expr-bg: #0e0e0e;
    --expr-fg: #d4e4ff;
    --expr-pfx: #ff8ba7;
    --expr-field: #8bd3ff;
    --expr-str: #a8f0c8;
    --expr-arrow: #ffd479;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  .muted { color: var(--text-3); }

  /* Opt out of every translucent surface when the OS asks for it. */
  @media (prefers-reduced-transparency: reduce) {
    #save-bar { background: var(--panel); backdrop-filter: none; }
    .modal-backdrop { background: rgba(0,0,0,.88); backdrop-filter: none; }
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: 500 14px var(--font);
    border-radius: var(--radius);
    padding: 6px 14px;
    height: 32px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    transition: background .12s, border-color .12s;
  }
  /* leading glyph in a labelled button: optically balance the tighter left edge */
  .btn > .ic:first-child { width: 14px; height: 14px; flex-shrink: 0; margin-left: -2px; }
  .btn:hover { border-color: var(--btn-hover-border); background: var(--panel-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--btn-primary-bg); border-color: var(--btn-primary-bg); color: var(--btn-primary-fg); }
  .btn.primary:hover { background: var(--btn-primary-hover); }
  .btn.primary:disabled { background: var(--text-3); border-color: var(--text-3); color: var(--btn-primary-fg); }
  .btn.danger { color: var(--danger); border-color: var(--danger-border); }
  .btn.danger:hover { background: var(--danger-weak); }
  .btn.small { padding: 3px 9px; font-size: 13px; height: 32px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--text-3); }
  .btn.ghost:hover { color: var(--text); background: var(--panel-2); }
  .btn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); margin-right: 6px; vertical-align: 1px; }

  /* ---------- layout ---------- */
  main { flex: 1; display: flex; min-height: 0; height: 100vh; }
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px 8px 12px;
    display: flex;
    flex-direction: column;
  }
  .sidebar-scroll { flex: 1; min-height: 0; padding-top: 4px; }
  .sidebar-title { padding: 14px 14px 16px; font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.02em; margin: 0; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-2);
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font: 500 14.5px var(--font);
  }
  .nav-item .ico { width: 16px; height: 16px; display: block; color: var(--text-3); flex-shrink: 0; }
  .nav-item:hover { background: var(--panel-2); color: var(--text); }
  .nav-item.active { background: var(--accent-weak); color: var(--accent); }
  .nav-item.active .ico { color: var(--accent); }
  /* the four utility actions (reset, reload, theme, shutdown) anchored to the
     sidebar's bottom edge; auto layout so the four share the full row width */
  .sidebar-tools {
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 10px 6px 2px;
    margin-top: 12px;
    border-top: 1px solid var(--border-2);
  }
  .sidebar-tools .icon-btn { flex: 1 1 0; }
  .sidebar-tools #shutdown-btn:hover { color: var(--danger); background: var(--danger-weak); }
  .content { flex: 1; overflow-y: auto; padding: 32px 44px 140px; }
  /* Cap the reading measure. Without this, description copy ran ~99 chars per
     line even at a modest window width. The inner wrapper keeps the scroll
     container full-bleed while the content column stays readable. */
  .content > #config-root,
  .content > .loading,
  #tab-run > *,
  #tab-models > * { max-width: var(--measure-page); margin-inline: auto; }
  .card-desc, .page-head p { max-width: var(--measure); }
  /* the drawer hamburger only exists below the drawer breakpoint; it is a
     floating button since there is no header to hold it. Needs the element+class
     specificity to beat .icon-btn's display:inline-flex. */
  button.nav-toggle {
    display: none;
    position: fixed; top: 10px; left: 10px; z-index: 62;
    background: var(--bar-bg);
    border: 1px solid var(--border);
    width: 34px; height: 34px;
  }
  .drawer-scrim {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0, 0, 0, .55);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .drawer-scrim.show { opacity: 1; pointer-events: auto; }

  /* raw expression editor (manual mode) */
  .raw-expr {
    width: 100%; min-height: 150px;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    background: var(--panel-2); resize: vertical;
  }

  /* icon buttons */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; border-radius: var(--radius);
    border: 1px solid transparent; background: transparent; color: var(--text-3);
    cursor: pointer; transition: background .12s, color .12s, border-color .12s;
    /* a square hit area is the whole point — without this, an overflowing flex
       row (the header at 375px) crushes a 30px button down to 17px */
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .icon-btn svg { width: 14px; height: 14px; display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  :root[data-theme="light"] .icon-sun { display: none; }

  /* ---------- icon sprite sizing ----------
     One family via <use href="#i-*">. Sized in em so an icon always tracks the
     text it sits beside; stroke weight is baked into the symbols. */
  .ic { width: 1em; height: 1em; display: block; flex-shrink: 0; }
  .icon-btn .ic { width: 15px; height: 15px; }
  .nav-item .ico { width: 16px; height: 16px; flex-shrink: 0; }
  .field-ico { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; margin-top: 1px; }
  .del .ic, .btn.icon-only .ic { width: 13px; height: 13px; margin-left: 0; }
  .btn.icon-only { padding: 0 7px; }
  /* visible to screen readers only: used for column headers that are visually
     blank (the actions column) so the table still announces a header per cell */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  /* sub-group heading inside a card (T3 driver groups, adapter groups) */
  .sub-title {
    margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .01em;
    color: var(--text-2);
  }
  /* ---------- focus visibility ----------
     Previously ONLY input/select/textarea had any focus styling, so buttons,
     tabs, nav items, chips and target cards were focusable but invisible. */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--r-sm);
  }
  .nav-item:focus-visible, .chip:focus-visible,
  .target-item:focus-visible, .icon-btn:focus-visible, .btn:focus-visible,
  .toggle:focus-visible, .modal-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* keep the richer ring on text controls, but make it AA-visible too */
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; }

  /* ---------- rule builder ---------- */
  .rule-row {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: grab;
    transition: box-shadow .12s, border-color .12s;
  }
  .rule-row:hover { border-color: var(--text-3); }
  .rule-row.dragging { opacity: .45; cursor: grabbing; }
  .rule-row.drag-over { border-top: 2px solid var(--accent); }
  .rule-main { display: flex; flex-direction: column; gap: 10px; }
  .rule-main-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rule-main-row select, .rule-main-row input[type="number"], .rule-main-row input[type="text"] { width: auto; }
  .rule-conds { display: flex; flex-direction: column; gap: 8px; }
  .rule-cond {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-sm);
  }
  .rule-cond-head { display: flex; gap: 6px; align-items: center; }
  .rule-join { font-size: 12px; color: var(--text-3); font-weight: 600; padding: 2px 0; letter-spacing: .04em; }
  .rule-ops { display: flex; gap: 4px; }
  .rule-ops button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text-3);
    border-radius: var(--r-sm); width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .rule-ops button:hover { color: var(--text); border-color: var(--text-3); }
  .rule-ops button.del:hover { color: var(--danger); border-color: var(--danger); }
  .rule-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .rule-exc { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .rule-exc label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .rule-exc input[type="checkbox"] { accent-color: var(--toggle-on); }

  /* chained-condition rule builder */
  .rule-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* row-header selects sit between inline labels and a ✕ in a tight row —
     13px text keeps field names like "input_context" from being cropped */
  .rule-head select { width: auto; font-size: 13px; padding-inline: 8px; }
  .drag-handle {
    color: var(--text-3); font-size: 14px; letter-spacing: -2px; cursor: grab;
    user-select: none; padding: 2px 2px; line-height: 1;
  }
  .drag-handle:hover { color: var(--text); }
  .rule-excepts { border-left: 2px solid var(--danger); padding-left: 10px; }
  .rule-subhead {
    font-size: 11.5px; font-weight: 700; color: var(--text-3); letter-spacing: .06em;
    text-transform: uppercase;
  }
  .rule-addcond { display: flex; gap: 6px; align-items: center; }
  .rule-addcond select { width: auto; font-size: 13px; padding-inline: 8px; }
  .not-badge {
    font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--danger);
    border: 1px solid var(--danger); border-radius: var(--r-sm); padding: 1px 5px;
  }
  .cond-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cond-row select, .cond-row input[type="number"], .cond-row input[type="text"] { width: auto; }
  .cond-tail { display: flex; gap: 4px; align-items: center; margin-left: auto; }
  .cond-kind { font-size: 12px; color: var(--text-3); }
  .rule-cond .chip { cursor: pointer; }
  .rule-cond .icon-btn { width: 24px; height: 24px; font-size: 13px; }

  /* manual block editor */
  .rule-num {
    font-size: 12px; font-weight: 700; color: var(--text-3); min-width: 18px; text-align: center;
    user-select: none;
  }
  /* manual-block header: one single row — handle, number, expression, ✕.
     nowrap keeps the ✕ on the same line as the textarea however long the
     expression is; the textarea is the only flexible child so it absorbs
     all the leftover width. */
  .manual-head { flex-wrap: nowrap; align-items: center; }
  .manual-head > .drag-handle { padding-left: 0; flex: 0 0 auto; }
  .manual-head > .rule-num { text-align: left; min-width: 0; flex: 0 0 auto; }
  .manual-head > textarea.manual-expr { flex: 1 1 auto; width: auto; min-width: 0; }
  /* the draggable .rule-row ancestor makes its whole subtree user-select:none,
     which would block dragging out a text selection inside the expression */
  .manual-head > textarea.manual-expr { user-select: text; -webkit-user-select: text; }
  .manual-head > .rule-ops { flex: 0 0 auto; margin-left: 0; }
  /* The manual block editor is an ORDERED pipeline, so it reads as ONE panel of
     hairline-divided rows — the reference idiom — instead of 24 competing cards.
     Collapsible group headers were the alternative, but rule order is semantic
     and the numbering is on screen, so hiding any row would lose meaning. */
  .rule-list {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .rule-list > .rule-row {
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    border-radius: 0;
    padding: 7px 10px;
    margin-bottom: 0;
  }
  .rule-list > .rule-row:first-child { border-top: none; }
  .rule-list > .rule-row:hover { background: var(--panel); }
  /* needs to outrank `.rule-list > .rule-row`'s hairline, which is declared above
     it at equal specificity, or the drop indicator disappears */
  .rule-list > .rule-row.drag-over { border-top: 2px solid var(--accent); }
  /* adapter chips wrap and trailing add-row */
  .adapter-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .adapter-wrap .list-empty { padding: 0; }
  .adapter-wrap > .add-row { flex: 0 0 100%; flex-wrap: nowrap; margin-top: 2px; }
  .adapter-wrap > .add-row select { flex: 0 0 150px; width: 150px; font-size: 13px; padding-inline: 8px; }
  .adapter-wrap > .add-row input[type="text"] { width: 150px; flex: 0 1 150px; min-width: 110px; }
  /* one line tall by default, matching a single-line text input (31px), with the
     text vertically centred by the symmetric 7px padding. resize:vertical still
     lets a long expression be dragged open. */
  textarea.manual-expr {
    width: 100%; margin: 0; resize: vertical;
    height: 32px; min-height: 32px;
    line-height: 16px;
    overflow-y: hidden;
  }
  textarea.manual-expr:focus { overflow-y: auto; }
  /* Inside a divided .rule-list the row IS the container, so the input's own
     border and fill just double every edge. Strip it back to bare text and
     bring the chrome back only on focus, where it marks the active row. */
  .rule-list textarea.manual-expr {
    background: none;
    padding-left: 6px; padding-right: 6px;
  }
  /* :not(:focus) is load-bearing — this selector is more specific than the
     generic `textarea:focus { border-color: var(--accent) }`, so without it
     the focused row would keep a transparent border and lose its accent edge. */
  .rule-list textarea.manual-expr:not(:focus) { border-color: transparent; }
  .rule-list textarea.manual-expr:hover:not(:focus) { border-color: var(--border); }
  .rule-list textarea.manual-expr:focus { background: var(--panel); }
  /* 24 resize nubs at once is visual noise; the affordance comes back on the
     row you are actually editing, where resize:vertical still works. */
  .rule-list textarea.manual-expr:not(:focus):not(:hover) { resize: none; }

  .expr-err { color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 0; }
  /* only indents when there IS an error, so an empty row stays exactly one line */
  .rule-list .expr-err:not(:empty) { margin-left: 38px; margin-bottom: 3px; }

  /* field-override rows */
  .inline-lab {
    font-size: 12px; color: var(--text-3); font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; user-select: none; white-space: nowrap;
  }
  /* needs .rule-head to outrank the generic `input[type="text"] { width:100% }`
     rule below, which otherwise ties on specificity and wins by source order */
  .rule-head input.ovr-value {
    width: 140px; flex: 0 0 auto; min-width: 90px;
    font-family: var(--mono); font-size: 13.5px;
  }
  /* push the delete button to the far right of the row header */
  .rule-head .rule-ops { margin-left: auto; }
  /* override rows: both fields grow to share the full row width —
     <drag> set <field select grows> to <value input grows> <✕> — so the ✕
     trails the value field instead of being pinned to the row's right edge
     with dead space in between */
  .rule-head.ovr-head { flex-wrap: nowrap; }
  .rule-head.ovr-head select { flex: 1 1 0; min-width: 0; width: auto; }
  .rule-head.ovr-head input.ovr-value { flex: 1 1 0; width: auto; min-width: 0; }
  .rule-head.ovr-head .rule-ops { margin-left: 0; }
  .ovr-targets { row-gap: 6px; }
  .ovr-h { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; color: var(--text-2); }
  .ovr-h input[type="checkbox"] { accent-color: var(--toggle-on); margin: 0; width: auto; }

  .list-empty { color: var(--text-3); font-size: 13.5px; padding: 8px 2px; }
  /* inside a bordered .rule-list the empty line needs the row's own inset */
  .rule-list > .list-empty { padding: 10px; }
  .add-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .add-row select { flex: 1; min-width: 160px; font-size: 13px; padding-inline: 8px; }
  .add-row .btn { white-space: nowrap; }
  /* inside a chip list the add-row always breaks onto its own line, so the
     "existing values" block reads separately from the "add one" control
     instead of trailing inline off whichever row happens to have room */
  .chips-wrap .add-row { flex: 0 0 100%; margin-top: 2px; }
  .chips-wrap .add-row input[type="text"] { width: 150px; flex: 0 1 150px; min-width: 110px; }

  /* ---------- page sections ---------- */
  .section { display: none; }
  .section.active { display: block; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .card-h1, .page-head h1 {
    font-size: 20px;
    font-weight: 650;
    margin: 0 0 4px;
    letter-spacing: -.015em;
    color: var(--text);
  }
  .card-h2, .sub-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -.005em;
    color: var(--text);
  }
  .card-desc, .page-head p {
    color: var(--text-3);
    font-size: 13.5px;
    margin: 0 0 16px;
    max-width: var(--measure);
    line-height: 1.45;
  }

  .field { display: grid; grid-template-columns: 260px 1fr; gap: 8px 20px; padding: 16px 0; border-top: 1px solid var(--border-2); align-items: start; }
  .field:first-of-type { border-top: none; }
  /* the label column: label text first, the per-field reset icon immediately
     after it (<label> <reset> <flex space> <controls>). Top-aligned so the
     icon reads as sitting on the label's first line, never centered against
     a tall control stack; the -6px nudge lines the glyph's top edge up with
     the text's cap height (the glyph is optically centered in a 32px button) */
  .field-side { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding-top: 7px; }
  .field-label { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: 550; color: var(--text); line-height: 19px; min-width: 0; }
  .field-label .field-text { min-width: 0; }
  .field-label .hint { display: block; color: var(--text-3); font-weight: 400; font-size: 13px; margin-top: 3px; line-height: 17px; max-width: var(--measure); }
  .field-reset { visibility: hidden; flex-shrink: 0; margin-top: -6px; }
  .field-reset.show { visibility: visible; }
  .field-ctl { min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field-ctl.ctl-end { justify-content: flex-end; }
  .field-ctl .grow { flex: 1; min-width: 180px; }

  input[type="text"], input[type="number"], select, textarea {
    font: 400 13.5px/1.4 var(--font);
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 10px;
    width: 100%;
    box-sizing: border-box;
  }
  /* single-line inputs and selects share one control height with the buttons
     that sit beside them in a row (add-rows, adapter rows, path rows) so a
     form group never mixes tall and short controls */
  input[type="text"], input[type="number"], select { height: 32px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
  select { width: auto; min-width: 120px; cursor: pointer; font-size: 13px; line-height: normal; padding: 4px 26px 4px 10px; }
  input::placeholder, textarea::placeholder { color: var(--placeholder); }
  input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--invalid-ring); }

  .toggle { position: relative; width: 40px; height: 22px; background: var(--toggle-off); border-radius: 22px; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--toggle-knob); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s, background .15s; }
  .toggle.on { background: var(--toggle-on); }
  .toggle.on::after { transform: translateX(18px); background: var(--toggle-knob-on); }

  /* section card heading: the conditional reset icon is pushed to the far
     right edge of the title row — it only exists while some field in the
     section differs from its default */
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .card-head .card-h1, .card-head .card-h2, .card-head .card-title { margin: 0; min-width: 0; flex: 1; }
  .card-head .section-reset { visibility: hidden; flex-shrink: 0; margin-left: auto; }
  .card-head .section-reset.show { visibility: visible; }

  /* ---------- target grid ---------- */
  .target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .target-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    transition: border-color .12s, background .12s;
  }
  .target-item:hover { border-color: var(--text-3); }
  .target-item.on { background: var(--panel); }
  .target-item .name { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
  .target-item .name small { display: block; color: var(--text-3); font-weight: 400; font-size: 12px; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  /* listEditor() emits .chips-wrap, which had no rule at all — it fell back to
     display:block, so chips got no gap in either axis and the add-row's
     width:100% input pushed the Add button onto its own line. */
  .chips-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chips-wrap .list-empty { padding: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 32px; box-sizing: border-box;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 3px 4px 3px 11px;
    font-family: var(--font);
    font-size: 13.5px;
    line-height: 17px;
    color: var(--text-2);
    cursor: pointer;
    user-select: none;
  }
  /* a chip with no remove button keeps its symmetric padding */
  .chip:not(:has(> .x)) { padding: 6px 11px; gap: 7px; }
  .chip:hover { border-color: var(--text-3); }
  .chip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 550; }
  /* sortBuilder()'s flip affordance is a <button>, so it needs the same reset */
  .chip > .chip-txt {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; padding: 0; margin: 0;
    font: inherit; color: inherit; cursor: pointer;
  }
  .chip > .chip-txt .ic { width: 11px; height: 11px; flex-shrink: 0; }
  /* was a 0x0 <span>: unclickable and keyboard-unreachable. Now a real button
     with a 22px square hit area that still reads as a small inline glyph. */
  .chip .x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; flex-shrink: 0;
    background: none; border: none; padding: 0; margin: 0;
    color: var(--text-3); cursor: pointer;
    border-radius: 50%;
  }
  .chip .x .ic { width: 11px; height: 11px; }
  .chip .x:hover { color: var(--danger); background: var(--danger-weak); }
  .chip.on .x { color: var(--accent); }

  /* Was styled inline at 9 separate call sites, each slightly different. */
  .field-note { color: var(--text-3); font-size: 12.5px; line-height: 1.5; max-width: var(--measure); }
  .field-note + .field-note { margin-top: 4px; }

  /* ---------- raw JSON escape hatch ---------- */
  .raw-summary { cursor: pointer; color: var(--text-3); font-size: 13px; width: fit-content; }
  .raw-summary:hover { color: var(--text-2); }
  .raw-json {
    width: 100%; min-height: 180px; margin-top: 8px;
    font-family: var(--mono); font-size: 13px; background: var(--panel-2);
  }
  .raw-json-err { color: var(--danger); font-size: 12px; margin-top: 4px; }
  .raw-json-err:empty { display: none; }

  /* ---------- expression preview ---------- */
  .expr-preview {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--expr-bg);
    color: var(--expr-fg);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    word-break: break-all;
    max-width: 100%;
  }  .expr-preview .pfx { color: var(--expr-pfx); }
  .expr-preview .field { color: var(--expr-field); }
  .expr-preview .str { color: var(--expr-str); }
  .expr-preview .arrow { color: var(--expr-arrow); }
  .match-count { font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .match-count b { color: var(--text-2); }

  /* ---------- mini tables ---------- */
  table.mini { border-collapse: collapse; width: 100%; }
  table.mini th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  table.mini td { padding: 4px 8px; }
  table.mini th:first-child, table.mini td:first-child { padding-left: 0; padding-right: 8px; width: 100%; }
  table.mini th.col-1m, table.mini td.col-1m { width: 1%; white-space: nowrap; text-align: center; padding-inline: 4px; }
  table.mini td.col-1m { vertical-align: middle; }
  table.mini td.col-1m .toggle { margin: 0 auto; }
  table.mini th.col-act, table.mini td.col-act { width: 1%; white-space: nowrap; text-align: right; padding-left: 4px; padding-right: 0; }
  table.mini td.col-act .del { margin-left: auto; }
  table.mini input, table.mini select { padding: 4px 8px; font-size: 13px; }
  table.mini .del {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-3);
    border-radius: var(--r-sm);
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0;
    line-height: 1;
    transition: color .12s, border-color .12s;
  }
  table.mini .del:hover {
    color: var(--danger);
    border-color: var(--danger);
  }
  table.mini .del .ic { width: 13px; height: 13px; }
  .table-add { margin-top: 8px; }

  /* ---------- file browser modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; z-index: 60;
  }
  @supports (backdrop-filter: blur(1px)) {
    .modal-backdrop { backdrop-filter: blur(6px) saturate(1.1); }
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
    width: 560px; max-width: 92vw; max-height: 80vh; display: flex; flex-direction: column;
  }
  /* filesystem paths are data, not prose — set them apart from the copy that
     introduces them instead of letting a long absolute path read as a sentence */
  .path-code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 1px 5px;
    color: var(--text-2); word-break: break-all;
  }

  .modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal-head .path { font-family: var(--mono); font-size: 13.5px; color: var(--text-2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-head .close {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex-shrink: 0;
    border: none; background: none; padding: 0;
    color: var(--text-3); cursor: pointer; border-radius: var(--r-sm);
  }
  .modal-head .close .ic { width: 14px; height: 14px; }
  .modal-head .close:hover { color: var(--text); background: var(--panel-2); }
  .modal-body { overflow-y: auto; padding: 8px; min-height: 220px; }
  /* .modal-row is a <button>, so the UA chrome and inherited font need resetting */
  .modal-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border: none; background: none; text-align: left;
    border-radius: var(--r-sm); cursor: pointer;
    font: 14px var(--font); color: var(--text);
  }
  .modal-row:hover { background: var(--panel-2); }
  .modal-row .ic { color: var(--text-3); width: 16px; height: 16px; flex-shrink: 0; }
  .modal-row.dir .ic { color: var(--accent); }
  .modal-row.file .ic { color: var(--text-3); }
  .modal-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); align-items: center; }
  .modal-foot input { flex: 1; }
  .modal-error { color: var(--danger); font-size: 13px; padding: 8px 12px; }

  /* ---------- run ---------- */
  .run-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .run-actions .sep { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }
  .run-actions label { font-size: 13px; color: var(--text-3); }
  .run-actions input[type="number"] { width: 100px; }
  /* keeps a numeric label glued to its own input across a flex wrap */
  .run-field { display: inline-flex; align-items: center; gap: 8px; }
  .run-status { padding: 10px 14px; border-radius: var(--radius); margin: 14px 0; font-size: 14px; display: none; }
  .run-status.running { display: block; background: var(--accent-weak); border: 1px solid var(--accent); color: var(--accent); }
  .run-status.ok { display: block; background: var(--success-weak); border: 1px solid var(--success); color: var(--success); }
  .run-status.fail { display: block; background: var(--danger-weak); border: 1px solid var(--danger); color: var(--danger); }
  #console {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px 16px;
    font: 14.5px/1.6 var(--mono);
    overflow-y: auto;
    /* was calc(100vh - 320px), a magic number tied to the old header height */
    min-height: 320px;
    max-height: 60vh;
    margin-top: 14px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
  }
  #console .ln { display: block; }
  #console .err { color: var(--danger); }
  #console .meta { color: var(--text-3); }
  /* placeholder so an idle console reads as "nothing yet" instead of a void */
  #console:empty::before {
    content: 'No output yet. Pick a target above to start a run.';
    color: var(--text-3);
    font: 14px var(--font);
  }

  /* ---------- models ---------- */
  .models-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .models-toolbar input[type="text"] { max-width: 260px; }
  .models-toolbar .count { color: var(--text-3); font-size: 13px; }
  table.models { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  table.models th {
    text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text-3);
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; font-weight: 600;
    background: var(--panel-2);
  }
  table.models th:hover { color: var(--text); }
  table.models td { padding: 7px 12px; border-bottom: 1px solid var(--border-2); font-size: 13.5px; }
  table.models td.num { font-family: var(--mono); text-align: right; font-size: 13px; }
  table.models tr:hover td { background: var(--panel-2); }
  .cap { font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill); }
  .cap.y { background: var(--success-weak); color: var(--success); }
  .cap.n { background: var(--border-2); color: var(--text-3); }
  .cap.na { background: var(--warning-weak); color: var(--warning); }
  .missing-note { color: var(--text-2); font-size: 14px; padding: 24px 0; }
  .providers { margin-top: 8px; }
  .router-tag { font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill); background: var(--accent-weak); color: var(--accent); }

  /* ---------- floating save bar ---------- */
  /* a centered floating card, not an edge-anchored strip: horizontal center
     via left:50% + translate(-50%), the same r-md corners as cards, and the
     translate-only slide-up retained for the show animation */
  #save-bar {
    position: fixed; bottom: 20px; left: 50%;
    background: var(--bar-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-lg);
    padding: 8px 12px;
    display: flex; align-items: center; gap: 12px;
    transform: translate(-50%, 140%);
    transition: transform .25s;
    z-index: 50;
    max-width: min(92vw, 560px);
  }
  @supports (backdrop-filter: blur(1px)) {
    #save-bar { backdrop-filter: blur(20px) saturate(1.4); }
  }
  #save-bar.show { transform: translate(-50%, 0); }
  #save-bar .msg { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #save-bar .msg b { color: var(--text); }
  /* the persistent destination pill: always visible at the bottom-right,
     telling you where edits land even when nothing is dirty. Sits just below
     the (transient) save bar so the two stack as one column. */
  #write-target {
    position: fixed; bottom: 20px; right: 20px; z-index: 49;
    display: flex; align-items: center; gap: 8px;
    background: var(--bar-bg);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    box-shadow: var(--shadow-md);
    font-size: 13px;
    color: var(--text-3);
    padding: 7px 16px;
  }
  @supports (backdrop-filter: blur(1px)) {
    #write-target { backdrop-filter: blur(20px) saturate(1.4); }
  }
  #write-target b { color: var(--text-2); font-weight: 600; }

  /* ---------- toast ---------- */
  #toast {
    /* anchored to the content column, not the viewport: with a 232px sidebar a
       viewport-centred toast reads as visibly left-shifted */
    position: fixed; bottom: 76px; left: calc(50% + 116px); transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px; border-radius: var(--r-sm);
    font-size: 14px; box-shadow: var(--shadow-md); transition: transform .2s, opacity .2s;
    opacity: 0; pointer-events: none; z-index: 70; max-width: 80vw;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast .sub { color: var(--text-3); font-size: 12px; display: block; }
  #toast.error { background: var(--danger); color: #fff; }

  .loading { color: var(--text-3); padding: 60px; text-align: center; font-size: 15px; }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 1100px) {
    /* sidebar is gone below this width, so recentre the toast on the viewport */
    #toast { left: 50%; }
  }
  @media (max-width: 760px) {
    /* The sidebar used to be display:none here with no replacement, leaving
       10 of the 11 config sections completely unreachable on a phone. It is
       now an off-canvas drawer driven by the floating .nav-toggle. */
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 61;
      width: min(280px, 84vw);
      transform: translateX(-100%);
      transition: transform .2s ease;
      box-shadow: var(--shadow-lg);
      padding-top: 18px;
    }
    .sidebar.open { transform: translateX(0); }
    button.nav-toggle { display: inline-flex; }
    .content { padding: 60px 18px 150px; }
    .field { grid-template-columns: 1fr; gap: 6px; }
    .field-side { padding-top: 0; grid-column: 1 / -1; }
    /* pills stack: persistent destination pill at the bottom, save bar above */
    #write-target { bottom: 14px; right: 14px; }
    #save-bar { bottom: 64px; left: 14px; right: 14px; transform: translateY(140%); justify-content: space-between; padding: 8px 10px 8px 16px; max-width: none; border-radius: var(--r-md); }
    #save-bar.show { transform: translateY(0); }
    #save-bar .msg { white-space: normal; }
  }
</style>
</head>

<script>
'use strict';

// ===========================================================================
// state
// ===========================================================================
const S = {
  defaults: null,
  base: null,
  local: null,
  effective: null,
  saved: null,
  writeTarget: '',
  localExists: false,
  meta: null,
  modelsSort: { key: 'id', dir: 1 },
};
let dirty = false;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const deepClone = (o) => o == null ? o : JSON.parse(JSON.stringify(o));

function toast(msg, sub, isError) {
  const t = $('#toast');
  t.innerHTML = '';
  t.textContent = msg;
  if (sub) { const s = document.createElement('span'); s.className = 'sub'; s.textContent = sub; t.appendChild(s); }
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), isError ? 5000 : 3200);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ===========================================================================
// provenance + helpers
// ===========================================================================
function getAt(obj, pathArr) {
  let node = obj;
  for (const p of pathArr) {
    if (node == null || typeof node !== 'object') return undefined;
    node = node[p];
  }
  return node;
}
function setAt(pathArr, value) {
  if (!pathArr.length) { S.effective = value; return; }
  let node = S.effective;
  for (let i = 0; i < pathArr.length - 1; i++) {
    if (node[pathArr[i]] == null || typeof node[pathArr[i]] !== 'object') node[pathArr[i]] = {};
    node = node[pathArr[i]];
  }
  node[pathArr[pathArr.length - 1]] = value;
}
function setDirty(v) {
  dirty = v;
  $('#save-bar').classList.toggle('show', v);
  $('#save-btn').disabled = !v;
  // every control funnels its edits through setDirty, so this is the one hook
  // that keeps the conditional field/section reset icons in step with the data
  refreshResetState();
}
// value differs from its default? JSON round-trip: stable for the scalars,
// arrays and plain objects this config holds, and order-sensitive for lists,
// which is exactly the semantics a reordered list deserves
function differsFromDefault(pathArr) {
  return JSON.stringify(getAt(S.effective, pathArr)) !== JSON.stringify(getAt(S.defaults, pathArr));
}
// Show/hide the per-field reset icons and the per-section reset icon of the
// ACTIVE section only — hidden sections are rebuilt on entry anyway.
function refreshResetState() {
  if (!S.defaults) return;
  const sec = $('#sec-' + currentSection());
  if (!sec) return;
  sec.querySelectorAll('.field-reset').forEach((btn) => {
    let pathArr = null;
    try { pathArr = JSON.parse(btn.dataset.path || 'null'); } catch (e) { /* noop */ }
    btn.classList.toggle('show', !!pathArr && differsFromDefault(pathArr));
  });
  const secBtn = sec.querySelector('.section-reset');
  if (secBtn) {
    const keys = SECTION_KEYS[currentSection()] || [];
    secBtn.classList.toggle('show', keys.some((k) => differsFromDefault(k)));
  }
}
function fieldLabel(key) {
  return key.replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());
}
// Display-only spellings for harness ids. The ids themselves are never changed —
// only what the user reads. Anything missing falls back to the raw id.
const HARNESS_LABEL = {
  opencode: 'OpenCode', kilo: 'Kilo', t3: 'T3', dsh: 'DSH',
  pi: 'pi', zcode: 'zcode', ocx: 'ocx', opencodex: 'ocx',
};
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Render a filesystem path as a labelled <code> chip instead of raw body copy.
// Long paths are truncated from the MIDDLE, since the filename at the tail is
// what identifies the file; the untruncated path stays available via title.
function setSourcePath(el, path, label) {
  el.textContent = '';
  if (!path) return;
  const full = String(path);
  const lead = label == null ? 'Source' : label;
  if (lead) el.appendChild(document.createTextNode(lead + ' '));
  const code = document.createElement('code');
  code.className = 'path-code';
  code.textContent = full.length > 58 ? full.slice(0, 26) + '…' + full.slice(-29) : full;
  code.title = full;
  el.appendChild(code);
}

// ===========================================================================
// generic control builders
// ===========================================================================
// Monotonic id source so every field can be wired label -> control.
let __fieldSeq = 0;

function fieldRow(labelText, hint, controlEl, pathArr, iconId) {
  const row = document.createElement('div');
  row.className = 'field';

  // Find the thing the label should point at. Native controls accept <label for>;
  // our toggle() is a role="switch" div, which does not, so that case is wired
  // with aria-labelledby instead.
  const native = controlEl.matches('input, select, textarea')
    ? controlEl
    : controlEl.querySelector('input, select, textarea');
  const widget = native || (controlEl.matches('[role="switch"], [role="checkbox"]')
    ? controlEl
    : controlEl.querySelector('[role="switch"], [role="checkbox"]'));

  const uid = 'f' + (++__fieldSeq);
  const label = document.createElement('label');
  label.className = 'field-label';
  label.id = uid + '-l';

  if (iconId) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'field-ico');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#' + iconId);
    svg.appendChild(use);
    label.appendChild(svg);
  }

  const nameWrap = document.createElement('span');
  nameWrap.className = 'field-text';
  const name = document.createElement('span');
  name.className = 'field-name';
  name.textContent = labelText;
  nameWrap.appendChild(name);
  // NOTE: .hint is queried by JS elsewhere, so the class and nesting stay.
  if (hint) {
    const h = document.createElement('span');
    h.className = 'hint';
    h.textContent = hint;
    nameWrap.appendChild(h);
  }
  label.appendChild(nameWrap);

  // the label column holds the label AND the per-field reset: the icon sits
  // right after the label text (not after a flexible gap, not against the
  // control), top-aligned with the first line of the label
  const side = document.createElement('div');
  side.className = 'field-side';
  side.appendChild(label);
  if (pathArr) side.appendChild(makeFieldReset(labelText, pathArr));
  row.appendChild(side);

  if (native) {
    if (!native.id) native.id = uid + '-c';
    label.setAttribute('for', native.id);
  } else if (widget) {
    // role=switch / role=checkbox: associate by reference.
    widget.setAttribute('aria-labelledby', label.id);
  }

  const ctl = document.createElement('div');
  ctl.className = 'field-ctl';
  // a lone switch reads as a setting toggle: right-align it in the control
  // column with flexible space before it, unlike an input which fills
  const isSwitch = !!(controlEl.matches('[role="switch"], [role="checkbox"]')
    || controlEl.querySelector('[role="switch"], [role="checkbox"]'));
  if (isSwitch) ctl.classList.add('ctl-end');
  if (isSwitch) {
    ctl.appendChild(controlEl);
  } else {
    const holder = document.createElement('div');
    holder.className = 'grow';
    holder.appendChild(controlEl);
    ctl.appendChild(holder);
  }
  row.appendChild(ctl);
  return row;
}

// per-field reset icon; hidden until the value differs from its default
function makeFieldReset(labelText, pathArr) {
  const reset = document.createElement('button');
  reset.type = 'button';
  reset.className = 'icon-btn field-reset';
  reset.dataset.path = JSON.stringify(pathArr);
  reset.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-reset"/></svg>';
  reset.title = 'Reset ' + labelText + ' to default';
  reset.setAttribute('aria-label', 'Reset ' + labelText + ' to default');
  reset.addEventListener('click', () => {
    setAt(pathArr, deepClone(getAt(S.defaults, pathArr)));
    setDirty(true);
    rebuildConfig();
    showSection(currentSection());
  });
  return reset;
}

function textField(pathArr, placeholder) {
  const val = getAt(S.effective, pathArr);
  const def = getAt(S.defaults, pathArr);
  const input = document.createElement('input');
  input.type = 'text';
  input.value = val == null ? '' : String(val);
  input.placeholder = placeholder !== undefined ? placeholder : (def == null ? '' : String(def));
  input.addEventListener('input', () => { setAt(pathArr, input.value); setDirty(true); });
  return input;
}
function numberField(pathArr, step) {
  const val = getAt(S.effective, pathArr);
  const input = document.createElement('input');
  input.type = 'number';
  input.step = step || '1000';
  input.min = '0';
  input.value = val == null ? 0 : val;
  input.addEventListener('input', () => { setAt(pathArr, input.value === '' ? 0 : parseInt(input.value, 10)); setDirty(true); });
  return input;
}
function toggle(pathArr) {
  const t = document.createElement('div');
  t.className = 'toggle' + (getAt(S.effective, pathArr) ? ' on' : '');
  t.tabIndex = 0;
  t.setAttribute('role', 'switch');
  t.setAttribute('aria-checked', String(getAt(S.effective, pathArr)));
  const update = (v) => { setAt(pathArr, v); t.classList.toggle('on', v); t.setAttribute('aria-checked', String(v)); setDirty(true); };
  t.addEventListener('click', () => update(!getAt(S.effective, pathArr)));
  t.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); t.click(); } });
  return t;
}
function select(options, current, onchange) {
  const sel = document.createElement('select');
  for (const [val, text] of options) {
    const o = document.createElement('option');
    o.value = val;
    o.textContent = text;
    sel.appendChild(o);
  }
  sel.value = String(current);
  sel.addEventListener('change', () => onchange(sel.value));
  return sel;
}

// level 1 = the section's own heading (one visible at a time, so one h1 per
// rendered page); 2 = a sub-card inside a section. Sizes come from the
// .card-h* classes, so the tag change alone never moves any pixels.
// resetFor: section name whose SECTION_KEYS drive the conditional reset icon
// rendered at the right edge of the title row.
function card(title, desc, level, resetFor) {
  const c = document.createElement('div');
  c.className = 'card';
  const lv = level || 2;
  if (title) {
    const head = document.createElement('div');
    head.className = 'card-head';
    const h = document.createElement('h' + lv);
    h.className = 'card-h' + lv;
    h.textContent = title;
    head.appendChild(h);

    head.appendChild(ops);

    box.appendChild(head);

    const err = document.createElement('div');
    err.className = 'expr-err';
    // commit-on-type: write the text into the array WITHOUT re-rendering, so
    // focus and caret position survive
    let vTimer = null;
    ta.addEventListener('input', () => {
      r.text = ta.value;
      clearTimeout(vTimer);
      pendingTimers.delete(vTimer);
      vTimer = setTimeout(() => {
        pendingTimers.delete(vTimer);
        // a re-render happened after this timer was scheduled — the row objects
        // this closure holds are stale, so writing them back would clobber it
        if (myGen !== gen) return;
        const a = allRows.map((x) => x.text);
        set(a);
        schedulePreview();
        validateExpr(ta.value).then((msg) => { err.textContent = msg || ''; });
      }, 300);
      pendingTimers.add(vTimer);
    });
    // validate whatever exists right now
    validateExpr(r.text).then((msg) => { if (msg) err.textContent = msg; });

    box.appendChild(err);
    return box;
  }

  render();
  return wrap;
}

function ruleBuilder(pathArr, opts = {}) {
  const wrap = document.createElement('div');
  wrap.style.flex = '1';
  const isHarness = !!opts.isHarness;
  const providers = (S.meta && S.meta.providers || []).map((p) => p.value);
  const families = (S.meta && S.meta.families || []).map((f) => f.value);
  const HARNESSES = S.meta ? S.meta.harnessIds : ['opencode', 'kilo', 't3', 'dsh', 'pi', 'zcode', 'ocx'];
  wrap.dataset.mode = 'gui';

  const get = () => getAt(S.effective, pathArr) || [];
  const set = (arr) => { setAt(pathArr, arr); setDirty(true); };

  // small icon-only button helper
  function iconBtn(sym, title, fn, extra) {
    const b = document.createElement('button');
    b.className = 'icon-btn' + (extra || '');
    b.innerHTML = sym;
    b.title = title;
    b.addEventListener('click', fn);
    return b;
  }

  let previewTimer = null;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(async () => {
      if (opts.isHarness) return;
      const countEl = wrap.querySelector('#preview-count');
      if (!countEl) return;
      const exprs = get().map((e) => String(e)).filter(Boolean);
      try {
        const r = await api('POST', '/api/preview-filters', { filters: exprs, sort: getAt(S.effective, ['model_sort']) || 'id' });
        if (r.available) countEl.innerHTML = '<b>' + r.kept.toLocaleString() + '</b> of ' + r.total.toLocaleString() + ' models match';
        else countEl.textContent = r.reason || '';
      } catch (e) { /* ignore */ }
    }, 350);
  }

  // commit(i, rows): write rows[i]'s expression into the array WITHOUT
  // re-rendering — the row objects are the single source of truth while the
  // builder is open, so controls keep their state and focus.
  function commit(i, rows) {
    const arr = get().slice();
    arr[i] = exprOf(rows[i]);
    set(arr);
    const foot = wrap.querySelectorAll('.rule-foot .expr-preview')[i];
    if (foot) foot.textContent = arr[i] || '(empty)';
    schedulePreview();
  }

  // HTML5 drag & drop reordering on the rule container
  function initDragDrop(box, rows) {
    let fromIdx = null;
    box.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.rule-row');
      if (!row) return;
      fromIdx = parseInt(row.dataset.idx, 10);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(fromIdx)); } catch (err) { /* IE */ }
    });
    box.addEventListener('dragend', () => {
      const row = box.querySelector('.rule-row.dragging');
      if (row) row.classList.remove('dragging');
      box.querySelectorAll('.rule-row.drag-over').forEach((r) => r.classList.remove('drag-over'));
      fromIdx = null;
    });
    box.addEventListener('dragover', (e) => {
      if (fromIdx == null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const row = e.target.closest('.rule-row');
      box.querySelectorAll('.rule-row.drag-over').forEach((r) => r.classList.remove('drag-over'));
      if (row && parseInt(row.dataset.idx, 10) !== fromIdx) row.classList.add('drag-over');
    });
    box.addEventListener('drop', (e) => {
      if (fromIdx == null) return;
      e.preventDefault();
      const row = e.target.closest('.rule-row');
      if (!row) return;
      const toIdx = parseInt(row.dataset.idx, 10);
      if (toIdx === fromIdx || isNaN(toIdx)) return;
      const moved = rows.splice(fromIdx, 1)[0];
      rows.splice(toIdx, 0, moved);
      set(rows.map(exprOf));
      render();
    });
  }

  function render() {
    wrap.innerHTML = '';
    const rows = get().map((e) => parseExprToRow(e, isHarness));
    if ((wrap.dataset.mode || 'gui') === 'raw') return renderRaw(rows);

    const box = document.createElement('div');
    box.style.flex = '1';
    if (!rows.length) {
      const e = document.createElement('div');
      e.className = 'list-empty';
      e.textContent = opts.emptyText || 'No rules yet. Everything passes through.';
      box.appendChild(e);
    }
    rows.forEach((row, i) => box.appendChild(renderRule(row, i, rows)));
    wrap.appendChild(box);
    initDragDrop(box, rows);

    // live preview line
    const prev = document.createElement('div');
    prev.className = 'field-note';
    prev.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--text-3);font-size:12.5px';
    prev.innerHTML = 'Live preview: <span id="preview-count">…</span>';
    wrap.appendChild(prev);

    // add controls + mode switch
    const addBar = document.createElement('div');
    addBar.className = 'add-row';
    addBar.style.marginTop = '8px';
    const kindSel = document.createElement('select');
    const kinds = [['provider', 'provider (e.g. gemini)'], ['family', 'model family (e.g. gpt)'], ['property', 'property comparison'], ['topN', 'top / bottom N']];
    for (const [v, t] of kinds) { const o = document.createElement('option'); o.value = v; o.textContent = t; kindSel.appendChild(o); }
    const addBtn = document.createElement('button');
    addBtn.className = 'btn small';
    addBtn.textContent = '+ add rule';
    addBtn.addEventListener('click', () => {
      const nr = { action: 'block', joiner: 'and', conditions: [freshCond(kindSel.value)], excepts: [], harnesses: null };
      if (kindSel.value === 'topN') { nr.action = 'allow'; }
      set(get().concat([exprOf(nr)]));
      render();
    });
    addBar.appendChild(kindSel);
    addBar.appendChild(addBtn);
    const rawBtn = iconBtn('✎', 'Manual mode — type filter expressions by hand', () => { wrap.dataset.mode = 'raw'; render(); });
    addBar.appendChild(rawBtn);
    wrap.appendChild(addBar);
    schedulePreview();
  }

  // Manual mode: one expression per line, validated per-line against the real parser.
  function renderRaw(rows) {
    const label = document.createElement('div');
    label.className = 'field-note';
    label.style.cssText = 'color:var(--text-3);font-size:12.5px;margin-bottom:4px';
    label.textContent = opts.rawNote || 'One expression per line. "!" blocks, "==xxx" keeps-only, bare allows; $field comparisons, (topN:sort) directives and "->t3,dsh" harness targeting all work.';
    wrap.appendChild(label);
    const ta = document.createElement('textarea');
    ta.className = 'raw-expr';
    ta.spellcheck = false;
    ta.value = rows.map((r) => r.raw).join('\n');
    const err = document.createElement('div');
    err.style.cssText = 'color:var(--danger);font-size:12px;margin-top:4px;min-height:14px';
    const guiBtn = iconBtn('☰', 'Back to dropdown mode', () => {
      // keep whatever is typed when switching back
      apply(ta.value);
      wrap.dataset.mode = 'gui';
      render();
    });
    guiBtn.style.marginTop = '4px';
    function apply(text) {
      const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
      set(lines);
      schedulePreview();
    }
    ta.addEventListener('input', () => {
      apply(ta.value);
      const lines = ta.value.split('\n');
      const bad = [];
      lines.forEach((l, idx) => {
        if (!l.trim()) return;
        const kind = isHarness ? 'harness_filter' : 'model_filter';
        api('POST', '/api/validate', { kind, expr: l })
          .then((r) => { if (!r.ok) bad[idx] = r.error; else delete bad[idx]; })
          .catch(() => {});
      });
      err.textContent = '';
    });
    wrap.appendChild(ta);
    wrap.appendChild(err);
    wrap.appendChild(guiBtn);
    schedulePreview();
  }

  function renderRule(r, i, allRows) {
    const box = document.createElement('div');
    box.className = 'rule-row';
    box.draggable = true;
    box.dataset.idx = i;

    // ── header line: drag handle, action, joiner, ops ──
    const head = document.createElement('div');
    head.className = 'rule-head';
    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.title = 'Drag to reorder';
    handle.textContent = '⋮⋮';
    head.appendChild(handle);
    const actSel = select([['block', 'Block'], ['allow', 'Allow'], ['only', 'Keep only']], r.action, (v) => { r.action = v; commit(i, allRows); });
    head.appendChild(actSel);
    if ((r.conditions || []).length > 1) {
      head.appendChild(select([['and', 'match ALL (and)'], ['or', 'match ANY (or)']], r.joiner || 'and', (v) => { r.joiner = v; commit(i, allRows); }));
    }
    const ops = document.createElement('div');
    ops.className = 'rule-ops';
    ops.appendChild(iconBtn('✕', 'Remove this rule', () => { const a = allRows.map(exprOf); a.splice(i, 1); set(a); render(); }));
    head.appendChild(ops);
    box.appendChild(head);

    const main = document.createElement('div');
    main.className = 'rule-main';

    // ── conditions list ──
    const condsBox = document.createElement('div');
    condsBox.className = 'rule-conds';
    (r.conditions || []).forEach((c, ci) => {
      if (ci > 0) {
        const j = document.createElement('div');
        j.className = 'rule-join';
        j.textContent = (r.joiner || 'and') === 'or' ? 'OR' : 'AND';
        condsBox.appendChild(j);
      }
      condsBox.appendChild(renderCond(c, ci, r.conditions, { parentRule: r, ruleIdx: i, allRows }));
    });
    const addCondBar = document.createElement('div');
    addCondBar.className = 'rule-addcond';
    const condKind = document.createElement('select');
    for (const [v, t] of [['provider', 'provider'], ['family', 'family'], ['property', 'property'], ['text', 'expression']]) {
      const o = document.createElement('option'); o.value = v; o.textContent = '+ ' + t; condKind.appendChild(o);
    }
    addCondBar.appendChild(condKind);
    addCondBar.appendChild(iconBtn('+', 'Add another condition to this rule (chained with the joiner above)', () => {
      r.conditions.push(freshCond(condKind.value === 'text' ? 'text' : condKind.value));
      commit(i, allRows);
      render();
    }));
    condsBox.appendChild(addCondBar);
    main.appendChild(condsBox);

    // ── excepts list ──
    const excBox = document.createElement('div');
    excBox.className = 'rule-conds rule-excepts';
    const excTitle = document.createElement('div');
    excTitle.className = 'rule-subhead';
    excTitle.textContent = 'EXCEPT (never match these)';
    excBox.appendChild(excTitle);
    (r.excepts || []).forEach((c, ei) => {
      excBox.appendChild(renderCond(c, ei, r.excepts, { parentRule: r, ruleIdx: i, allRows, isExcept: true }));
    });
    const excKind = document.createElement('select');
    for (const [v, t] of [['family', 'family'], ['provider', 'provider'], ['property', 'property'], ['text', 'expression']]) {
      const o = document.createElement('option'); o.value = v; o.textContent = '+ except ' + t; excKind.appendChild(o);
    }
    const addExcBar = document.createElement('div');
    addExcBar.className = 'rule-addcond';
    addExcBar.appendChild(excKind);
    addExcBar.appendChild(iconBtn('⊟', 'Add an exception — this rule will not match models matching the exception', () => {
      r.excepts.push(freshCond(excKind.value === 'text' ? 'text' : excKind.value));
      commit(i, allRows);
      render();
    }));
    excBox.appendChild(addExcBar);
    if (!(r.excepts || []).length) {
      const hint = document.createElement('div');
      hint.className = 'field-note';
      hint.style.cssText = 'font-size:12px;color:var(--text-3)';
      hint.textContent = 'No exceptions — add one to carve models out of this rule.';
      excBox.appendChild(hint);
    }
    main.appendChild(excBox);

    // ── harness targeting (harness_filters) ──
    if (opts.allowHarnessTarget) {
      const target = document.createElement('div');
      target.className = 'rule-conds';
      const tTitle = document.createElement('div');
      tTitle.className = 'rule-subhead';
      tTitle.textContent = 'APPLIES TO';
      target.appendChild(tTitle);
      const tRow = document.createElement('div');
      tRow.className = 'rule-cond';
      HARNESSES.forEach((h) => {
        const ck = document.createElement('label');
        ck.style.cssText = 'display:flex;align-items:center;gap:3px;cursor:pointer;font-size:13px';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!(r.harnesses && r.harnesses.includes(h));
        cb.addEventListener('change', () => {
          r.harnesses = r.harnesses || [];
          if (cb.checked) { if (!r.harnesses.includes(h)) r.harnesses.push(h); }
          else r.harnesses = r.harnesses.filter((x) => x !== h);
          commit(i, allRows);
        });
        ck.appendChild(cb); ck.appendChild(document.createTextNode(h));
        tRow.appendChild(ck);
      });
      target.appendChild(tRow);
      main.appendChild(target);
    }

    box.appendChild(main);

    // expression preview
    const foot = document.createElement('div');
    foot.className = 'rule-foot';
    const pv = document.createElement('div');
    pv.className = 'expr-preview';
    pv.textContent = exprOf(r) || '(empty)';
    foot.appendChild(pv);
    box.appendChild(foot);
    return box;
  }

  function renderCond(c, ci, list, ctx) {
    const cond = document.createElement('div');
    cond.className = 'rule-cond';
    const r = ctx.parentRule;
    const commitFn = () => commit(ctx.ruleIdx, ctx.allRows);

    // negate badge for excepts (display-only: excepts are structurally NOT-ed)
    if (ctx.isExcept) {
      const nb = document.createElement('span');
      nb.className = 'not-badge';
      nb.textContent = 'NOT';
      cond.appendChild(nb);
    }

    // kind-specific controls
    const row = document.createElement('div');
    row.className = 'cond-row';
    if (c.kind === 'provider') {
      row.appendChild(select([...providers.map((p) => [p, p]), ['__custom', 'custom…']], c.provider, (v) => { if (v !== '__custom') { c.provider = v; commitFn(); } }));
      const globChip = document.createElement('span');
      globChip.className = 'chip' + (c.glob ? ' on' : '');
      globChip.textContent = c.glob ? 'everything under' : 'exact';
      globChip.title = 'Toggle: provider/* vs provider exactly';
      globChip.style.cursor = 'pointer';
      globChip.addEventListener('click', () => { c.glob = !c.glob; commitFn(); render(); });
      row.appendChild(globChip);
    } else if (c.kind === 'family') {
      row.appendChild(select([...families.map((f) => [f, f]), ['__custom', 'custom…']], c.family, (v) => { if (v !== '__custom') { c.family = v; commitFn(); } }));
    } else if (c.kind === 'property') {
      row.appendChild(select(S.meta.sortFields.map((f) => [f, '$' + f]), c.prop, (v) => { c.prop = v; commitFn(); }));
      row.appendChild(select([['<', '<'], ['<=', '≤'], ['>', '>'], ['>=', '≥'], ['=', '='], ['!=', '≠']], c.op, (v) => { c.op = v; commitFn(); }));
      const vin = document.createElement('input');
      vin.type = 'number';
      vin.style.width = '110px';
      vin.value = c.value;
      vin.addEventListener('input', () => { c.value = vin.value; commitFn(); });
      row.appendChild(vin);
    } else if (c.kind === 'topN') {
      row.appendChild(select([['top', 'Top'], ['bottom', 'Bottom']], c.dir, (v) => { c.dir = v; commitFn(); }));
      const nin = document.createElement('input');
      nin.type = 'number';
      nin.style.width = '80px';
      nin.value = c.n;
      nin.addEventListener('input', () => { c.n = Math.max(0, parseInt(nin.value, 10) || 0); commitFn(); });
      row.appendChild(nin);
      const ssel = document.createElement('select');
      ssel.innerHTML = '<option value="">keep catalog order</option>';
      for (const f of S.meta.sortFields) ssel.innerHTML += '<option value="-' + f + '">by ' + f + ' (desc)</option>';
      ssel.value = c.sort;
      ssel.addEventListener('change', () => { c.sort = ssel.value; commitFn(); });
      row.appendChild(ssel);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.style.flex = '1';
      inp.value = c.text;
      inp.placeholder = 'advanced expression (e.g. $input_context<200000)';
      inp.addEventListener('input', () => { c.text = inp.value; commitFn(); });
      row.appendChild(inp);
    }

    // condition-level controls: NOT toggle + kind switch + remove
    const tail = document.createElement('div');
    tail.className = 'cond-tail';
    if (!ctx.isExcept) {
      const notChip = document.createElement('span');
      notChip.className = 'chip' + (c.negate ? ' on' : '');
      notChip.textContent = 'NOT';
      notChip.title = 'Negate this condition';
      notChip.style.cursor = 'pointer';
      notChip.addEventListener('click', () => { c.negate = !c.negate; commitFn(); render(); });
      tail.appendChild(notChip);
    }
    const kindSel = document.createElement('select');
    kindSel.className = 'cond-kind';
    kindSel.title = 'Change what this condition matches on';
    for (const [v, t] of [['provider', 'provider'], ['family', 'family'], ['property', 'property'], ['text', 'expr']]) {
      const o = document.createElement('option'); o.value = v; o.textContent = t;
      if (v === c.kind) o.selected = true;
      kindSel.appendChild(o);
    }
    kindSel.addEventListener('change', () => {
      const nc = freshCond(kindSel.value);
      nc.negate = c.negate;
      list[ci] = nc;
      commitFn();
      render();
    });
    tail.appendChild(kindSel);
    tail.appendChild(iconBtn('✕', 'Remove this condition', () => { list.splice(ci, 1); commitFn(); render(); }));
    row.appendChild(tail);
    cond.appendChild(row);
    return cond;
  }

  render();
  return wrap;
}

// ===========================================================================
// override builder
// ===========================================================================
function overrideBuilder(pathArr, opts = {}) {
  const wrap = document.createElement('div');
  wrap.style.flex = '1';
  const HARNESSES = S.meta ? S.meta.harnessIds : ['opencode', 'kilo', 't3', 'dsh', 'pi', 'zcode', 'ocx'];
  const FIELDS = S.meta ? S.meta.overrideFields : ['id', 'input_context', 'output_context', 'vision', 'reasoning', 'tool'];
  const get = () => getAt(S.effective, pathArr) || [];
  const set = (arr) => { setAt(pathArr, arr); setDirty(true); };
  wrap.dataset.mode = 'gui';

  function parse(s) {
    const raw = String(s == null ? '' : s).trim();
    const arrow = raw.lastIndexOf('->');
    let targets = null;
    let body = raw;
    if (arrow !== -1) { targets = raw.slice(arrow + 2).split(',').map((x) => x.trim()).filter(Boolean); body = raw.slice(0, arrow).trim(); }
    const m = body.match(/^\(?([A-Za-z_]+)\s*:\s*([^)]+)\)?$/);
    if (!m) return { field: 'input_context', value: '1000000', targets, raw };
    return { field: m[1].trim(), value: m[2].trim(), targets, raw };
  }
  function build(o) {
    let out = '(' + o.field + ':' + o.value + ')';
    if (o.targets && o.targets.length) out += '->' + o.targets.join(',');
    return out;
  }
  // write rows[i] back without re-rendering, so open dropdowns/inputs keep state
  function commit(i, rows) {
    const a = get().slice();
    a[i] = build(rows[i]);
    set(a);
    const foot = wrap.querySelectorAll('.rule-foot .expr-preview')[i];
    if (foot) foot.textContent = a[i];
  }
  // HTML5 drag & drop reordering
  function initDragDrop(box, rows) {
    let fromIdx = null;
    box.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.rule-row');
      if (!row) return;
      fromIdx = parseInt(row.dataset.idx, 10);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(fromIdx)); } catch (err) { /* IE */ }
    });
    box.addEventListener('dragend', () => {
      const row = box.querySelector('.rule-row.dragging');
      if (row) row.classList.remove('dragging');
      box.querySelectorAll('.rule-row.drag-over').forEach((r) => r.classList.remove('drag-over'));
      fromIdx = null;
    });
    box.addEventListener('dragover', (e) => {
      if (fromIdx == null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const row = e.target.closest('.rule-row');
      box.querySelectorAll('.rule-row.drag-over').forEach((r) => r.classList.remove('drag-over'));
      if (row && parseInt(row.dataset.idx, 10) !== fromIdx) row.classList.add('drag-over');
    });
    box.addEventListener('drop', (e) => {
      if (fromIdx == null) return;
      e.preventDefault();
      const row = e.target.closest('.rule-row');
      if (!row) return;
      const toIdx = parseInt(row.dataset.idx, 10);
      if (toIdx === fromIdx || isNaN(toIdx)) return;
      const moved = rows.splice(fromIdx, 1)[0];
      rows.splice(toIdx, 0, moved);
      set(rows.map(build));
      render();
    });
  }
  function render() {
    wrap.innerHTML = '';
    const rows = get().map(parse);
    if ((wrap.dataset.mode || 'gui') === 'raw') return renderRaw(rows);

    const box = document.createElement('div');
    box.style.flex = '1';
    wrap.appendChild(box);
    if (!rows.length) { const e = document.createElement('div'); e.className = 'list-empty'; e.textContent = opts.emptyText || '(no overrides)'; box.appendChild(e); }
    rows.forEach((row, i) => {
      const rbox = document.createElement('div');
      rbox.className = 'rule-row';
      rbox.draggable = true;
      rbox.dataset.idx = i;
      const main = document.createElement('div');
      main.className = 'rule-main';
      const head = document.createElement('div');
      head.className = 'rule-head ovr-head';
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.title = 'Drag to reorder';
      handle.setAttribute('aria-hidden', 'true');
      handle.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><use href="#i-grip"/></svg>';
      head.appendChild(handle);
      const fLab = document.createElement('span');
      fLab.className = 'inline-lab';
      fLab.textContent = 'set';
      head.appendChild(fLab);
      const fsel = select(FIELDS.map((f) => [f, fieldLabel(f)]), row.field, (v) => { row.field = v; commit(i, rows); });
      fsel.setAttribute('aria-label', 'Override ' + (i + 1) + ' field');
      head.appendChild(fsel);
      const vLab = document.createElement('span');
      vLab.className = 'inline-lab';
      vLab.textContent = 'to';
      head.appendChild(vLab);
      const vin = document.createElement('input');
      vin.type = 'text';
      vin.className = 'ovr-value';
      vin.placeholder = 'value';
      vin.value = row.value;
      vin.setAttribute('aria-label', 'Override ' + (i + 1) + ' value');
      vin.addEventListener('input', () => { row.value = vin.value; commit(i, rows); });
      head.appendChild(vin);
      const ops = document.createElement('div');
      ops.className = 'rule-ops';
      const del = document.createElement('button');
      del.className = 'icon-btn';
      del.type = 'button';
      del.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>';
