function openFileBrowser(input, pathArr) {
  let cur = '~';
  const root = $('#modal-root');
  root.innerHTML = '';
  const returnFocus = document.activeElement;
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-label', 'Browse for a file or folder');
  const head = document.createElement('div');
  head.className = 'modal-head';
  const pathEl = document.createElement('span');
  pathEl.className = 'path';
  const close = document.createElement('button');
  close.className = 'close';
  close.type = 'button';
  close.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-x"/></svg>';
  close.title = 'Close';
  close.setAttribute('aria-label', 'Close file browser');
  // Every exit route lands here so focus always returns to the Browse button.
  function dismiss() {
    root.innerHTML = '';
    document.removeEventListener('keydown', onKey);
    if (returnFocus && returnFocus.focus) returnFocus.focus();
  }
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
  }
  document.addEventListener('keydown', onKey);
  back.addEventListener('mousedown', (e) => { if (e.target === back) dismiss(); });
  close.addEventListener('click', dismiss);
  head.appendChild(pathEl); head.appendChild(close);
  const body = document.createElement('div');
  body.className = 'modal-body';
  const foot = document.createElement('div');
  foot.className = 'modal-foot';
  const val = document.createElement('input');
  val.type = 'text';
  val.setAttribute('aria-label', 'Selected path');
  foot.appendChild(val);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn small';
  cancelBtn.type = 'button';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', dismiss);
  foot.appendChild(cancelBtn);
  const useBtn = document.createElement('button');
  useBtn.className = 'btn primary small';
  useBtn.type = 'button';
  useBtn.textContent = 'Use this path';
  useBtn.addEventListener('click', () => {
    input.value = val.value;
    setAt(pathArr, val.value);
    setDirty(true);
    dismiss();
  });
  foot.appendChild(useBtn);
  modal.appendChild(head); modal.appendChild(body); modal.appendChild(foot);
  back.appendChild(modal);
  root.appendChild(back);

  // Rows were click-only <div>s. A real <button> keeps the same click handler
  // but becomes tabbable and responds to Enter/Space for free.
  function mkRow(kind, sym, name, onPick) {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'modal-row ' + kind;
    row.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="' + sym + '"/></svg><span class="nm"></span>';
    row.querySelector('.nm').textContent = name;
    row.addEventListener('click', onPick);
    return row;
  }

  async function load(dir) {
    cur = dir;
    pathEl.textContent = dir;
    val.value = dir;
    body.innerHTML = '';
    try {
      const r = await api('GET', '/api/browse?dir=' + encodeURIComponent(dir));
      pathEl.textContent = r.dir;
      val.value = r.dir;
      if (r.parent) {
        const up = mkRow('dir', '#i-arrow-up', '.. (up)', () => load(r.parent));
        body.appendChild(up);
      }
      for (const d of r.dirs) {
        body.appendChild(mkRow('dir', '#i-chevron-right', d, () => load(r.dir + '/' + d)));
      }
      for (const f of r.files) {
        body.appendChild(mkRow('file', '#i-file', f, () => { val.value = r.dir + '/' + f; }));
      }
      if (!r.dirs.length && !r.files.length && !r.parent) {
        const e = document.createElement('div');
        e.className = 'modal-error';
        e.textContent = r.error || 'Folder is empty';
        body.appendChild(e);
      }
    } catch (e) {
      const err = document.createElement('div');
      err.className = 'modal-error';
      err.textContent = e.message;
      body.appendChild(err);
    }
  }
  load(cur);
}

function showSection(name) {
  $$('#config-root .section').forEach((s) => s.classList.remove('active'));

  if (el) el.classList.add('active');
  $$('#config-nav .nav-item').forEach((b) => {

function harnessChips(pathArr) {
  const wrap = document.createElement('div');
  wrap.style.flex = '1';
  const HARNESSES = S.meta ? S.meta.harnessIds : ['opencode', 'kilo', 't3', 'dsh', 'pi', 'zcode', 'ocx'];
  const render = () => {
    wrap.innerHTML = '';
    const arr = getAt(S.effective, pathArr) || [];
    const chips = document.createElement('div');
    chips.className = 'chips';
    HARNESSES.forEach((h) => {
      const on = arr.includes(h);
      // These are toggles, not labels: a real <button> with aria-pressed makes the
      // on/off state audible and the chip reachable without a mouse.
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (on ? ' on' : '');
      chip.textContent = HARNESS_LABEL[h] || h;
      chip.setAttribute('aria-pressed', on ? 'true' : 'false');
      chip.addEventListener('click', () => {
        const a = getAt(S.effective, pathArr) || [];
        const n = a.includes(h) ? a.filter((x) => x !== h) : a.concat([h]);
        setAt(pathArr, n); setDirty(true); render();
      });
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
  };
  render();
  return wrap;
}

function rawJson(pathArr, title) {
  const wrap = document.createElement('details');
  wrap.style.cssText = 'flex:1;width:100%';
  const summary = document.createElement('summary');
  summary.className = 'raw-summary';
  summary.textContent = title;
  wrap.appendChild(summary);
  const ta = document.createElement('textarea');
  ta.value = JSON.stringify(getAt(S.effective, pathArr), null, 2);
  ta.spellcheck = false;
  ta.className = 'raw-json';
  ta.setAttribute('aria-label', title);
  const err = document.createElement('div');
  err.className = 'raw-json-err';
  err.setAttribute('role', 'alert');
  wrap.appendChild(ta);
  wrap.appendChild(err);
  ta.addEventListener('input', () => {
    try {
      const v = JSON.parse(ta.value);
      setAt(pathArr, v);
      err.textContent = '';
      setDirty(true);
    } catch (e) { err.textContent = e.message; }
  });
  return wrap;
}

// Views are sidebar entries: 'run' and 'models' are leaf views, 'config'
// returns to whichever config section was last active.
function showView(name) {
  $('#config-content').style.display = name === 'config' ? '' : 'none';
  $('#tab-run').style.display = name === 'run' ? '' : 'none';
  $('#tab-models').style.display = name === 'models' ? '' : 'none';
  $$('#config-nav .nav-item[data-view]').forEach((b) => {
    const on = b.dataset.view === name;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (name !== 'config') {
    // leaving config view clears the section highlight so only one sidebar
    // entry reads as current
    $$('#config-nav .nav-item[data-sec]').forEach((b) => {
      b.classList.remove('active');
      b.removeAttribute('aria-current');
    });
    closeDrawer();
  }
  if (name === 'models') loadModels();
}

// ===========================================================================
// mobile nav drawer
// ===========================================================================
let drawerReturnFocus = null;
function drawerOpen() { return $('#config-nav').classList.contains('open'); }
function openDrawer() {
  const nav = $('#config-nav');
  if (!nav || drawerOpen()) return;
  drawerReturnFocus = document.activeElement;
  nav.classList.add('open');
  $('#drawer-scrim').classList.add('show');
  $('#nav-toggle').setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
  (nav.querySelector('.nav-item.active') || nav.querySelector('.nav-item'))?.focus();
}
function closeDrawer() {
  const nav = $('#config-nav');
  if (!nav || !nav.classList.contains('open')) return;
  nav.classList.remove('open');
  $('#drawer-scrim').classList.remove('show');
  $('#nav-toggle').setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
  const back = drawerReturnFocus;
  drawerReturnFocus = null;
  // Never hand focus back to something inside the drawer we just closed — it is
  // off-canvas now, so the focus ring would vanish. The hamburger is the
  // affordance that opened it, so it is the correct landing spot.
  if (back && document.contains(back) && !back.closest('#config-nav')) back.focus();
  else $('#nav-toggle')?.focus();
}
function initDrawer() {
  const scrim = document.createElement('div');
  scrim.className = 'drawer-scrim';
  scrim.id = 'drawer-scrim';
  scrim.addEventListener('click', closeDrawer);
  document.body.appendChild(scrim);
  $('#nav-toggle').addEventListener('click', () => (drawerOpen() ? closeDrawer() : openDrawer()));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawerOpen()) { e.preventDefault(); closeDrawer(); return; }
    if (e.key !== 'Tab' || !drawerOpen()) return;
    // trap Tab inside the open drawer
    const items = [...$('#config-nav').querySelectorAll('button:not([disabled])')];
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

// ===========================================================================
// run console (SSE)
// ===========================================================================
function setRunStatus(state, text) {
  const el = $('#run-status');
  el.className = 'run-status ' + state;
  el.textContent = text;
}
function appendLine(line) {
  const c = $('#console');
  const span = document.createElement('span');
  span.className = 'ln ' + (line.stream === 'err' ? 'err' : line.stream === 'meta' ? 'meta' : '');
  span.textContent = line.text;
  c.appendChild(span);
  c.scrollTop = c.scrollHeight;
}
function connectSSE() {
  const es = new EventSource('/api/run/stream');
  es.addEventListener('log', (e) => appendLine(JSON.parse(e.data)));
  es.addEventListener('done', (e) => {
    const { code } = JSON.parse(e.data);
    setRunButtons(false);
    setRunStatus(code === 0 ? 'ok' : 'fail', code === 0 ? 'Finished, exit 0' : 'Finished, exit ' + code);
    appendLine({ stream: 'meta', text: '--- exit ' + code + ' ---' });
  });
  api('GET', '/api/run/status').then((st) => {
    if (!st.hasRun) return;
    setRunButtons(st.active);
    setRunStatus(st.active ? 'running' : st.exitCode === 0 ? 'ok' : 'fail', st.active ? 'Running: ' + st.cmdline : (st.exitCode === 0 ? 'Finished, exit 0' : 'Finished, exit ' + st.exitCode));
  }).catch(() => {});
}
function setRunButtons(active) {
  $('#stop-btn').disabled = !active;
  $$('#tab-run .run-actions button:not(#stop-btn)').forEach((b) => (b.disabled = active));
}
async function startRun(targets) {
  if (dirty) { toast('You have unsaved changes', 'Save first. Runs use the config on disk.', true); return; }
  try {
    const r = await api('POST', '/api/run', { targets, minInput: $('#run-mi').value, minOutput: $('#run-mo').value });
    setRunButtons(true);
    $('#console').innerHTML = '';
    setRunStatus('running', '▶ ' + r.cmdline);
    appendLine({ stream: 'meta', text: '$ ' + r.cmdline });
  } catch (e) { toast('Run failed', e.message, true); }
}

function formatNum(n) {
  const v = parseFloat(n);
  if (isNaN(v)) return n;
  return v >= 1000000 ? (v / 1000000).toFixed(1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(v);
}
let modelsCache = null;
async function loadModels() {
  const which = $('#models-which').value;
  try {
    const r = await api('GET', '/api/models?file=' + which);
    const wrap = $('#models-table-wrap');
    wrap.innerHTML = '';
    setSourcePath($('#models-path'), r.path, 'Source');
    if (!r.exists) {
      const p = document.createElement('p');
      p.className = 'missing-note';
      p.textContent = 'File not found yet. Run Fetch in the Run tab first.';
      wrap.appendChild(p);
      $('#models-count').textContent = '';
      loadProviders();
      return;
    }
    modelsCache = r.rows;
    renderModelsTable(r.rows);
    $('#models-count').textContent = r.rows.length + ' models';
  } catch (e) { toast('Failed to load models', e.message, true); }
  loadProviders();
}
function renderModelsTable(rows) {
  const wrap = $('#models-table-wrap');
  wrap.innerHTML = '';
  const search = $('#models-search').value.trim().toLowerCase();
  let data = search ? rows.filter((r) => (r.id || '').toLowerCase().includes(search)) : rows.slice();
  const { key, dir } = S.modelsSort;
  data.sort((a, b) => {
    const av = parseFloat(a[key]), bv = parseFloat(b[key]);
    if (!isNaN(av) && !isNaN(bv)) return (av - bv) * dir;
    return String(a[key]).localeCompare(String(b[key])) * dir;
  });
  const table = document.createElement('table');
  table.className = 'models';
  const thead = table.createTHead();
  const hr = thead.insertRow();
  for (const col of ['id', 'input_context', 'output_context', 'vision', 'reasoning', 'tool']) {
    const th = document.createElement('th');
    th.textContent = col + (col === key ? (dir === 1 ? ' ▲' : ' ▼') : '');
    th.addEventListener('click', () => {
      if (S.modelsSort.key === col) S.modelsSort.dir *= -1;
      else S.modelsSort = { key: col, dir: col === 'id' ? 1 : -1 };
      renderModelsTable(rows);
    });
    hr.appendChild(th);
  }
  const tbody = table.createTBody();
  const frag = document.createDocumentFragment();
  for (const m of data) {
    const tr = document.createElement('tr');
    const tdId = document.createElement('td');
    tdId.textContent = m.id;
    tr.appendChild(tdId);
    for (const col of ['input_context', 'output_context']) {
      const td = document.createElement('td');
      td.className = 'num';
      td.textContent = formatNum(m[col]);
      tr.appendChild(td);
    }
    for (const col of ['vision', 'reasoning', 'tool']) {
      const td = document.createElement('td');
      const v = String(m[col]);
      td.innerHTML = v === '1' ? '<span class="cap y">yes</span>' : v === '0' ? '<span class="cap n">no</span>' : '<span class="cap na">n/a</span>';
      tr.appendChild(td);
    }
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
  wrap.appendChild(table);
}
async function loadProviders() {
  try {
    const r = await api('GET', '/api/providers');
    const wrap = $('#providers-table-wrap');
    wrap.innerHTML = '';
    setSourcePath($('#providers-path'), r.path, 'Source');
    if (!r.exists) {
      wrap.innerHTML = '<p class="missing-note">providers.csv not found. The first terminal run will prompt you for the Router URL and key.</p>';
      return;
    }
    const table = document.createElement('table');
    table.className = 'mini providers';
    table.innerHTML = '<thead><tr><th>Provider</th><th>Base URL</th><th>API key</th><th></th></tr></thead>';
    const tbody = table.createTBody();
    for (const p of r.rows) {
      const tr = tbody.insertRow();
      tr.insertCell().textContent = p.provider;
      tr.insertCell().textContent = p.base_url;
      tr.insertCell().textContent = p.api_key;
      const td = tr.insertCell();
      if (p.isRouter) td.innerHTML = '<span class="router-tag">Router</span>';
    }
    wrap.appendChild(table);
  } catch (e) { /* optional */ }
}

// ===========================================================================
// init
// ===========================================================================
async function init() {
  try {
    const [cfg, meta] = await Promise.all([api('GET', '/api/config'), api('GET', '/api/meta')]);
    S.defaults = cfg.defaults;
    S.base = cfg.base;
    S.local = cfg.local || {};
    S.effective = cfg.effective;
    S.saved = deepClone(cfg.effective);
    S.writeTarget = cfg.writeTarget;
    S.localExists = cfg.localExists;
    S.meta = meta;
    const shortTarget = esc(cfg.writeTarget.split(/[\\/]/).pop());
    $('#write-target').innerHTML = 'saving to <b>' + shortTarget + '</b>';
    buildConfigUI();
    showSection('general');
  } catch (e) {
    const el = $('#config-loading');
    el.textContent = 'Could not reach the omnilist server: ' + e.message;
    el.style.cssText = 'color:var(--danger);padding:60px;text-align:center';
    const hint = document.createElement('div');
    hint.style.cssText = 'color:var(--text-3);font-size:14px;margin-top:12px';
    hint.innerHTML = 'Open this page through the server, e.g. <code>http://127.0.0.1:47613/</code>. Run <code>omnilist gui</code> in a terminal to start it.';
    el.appendChild(hint);
    return;
  }
  connectSSE();
}

// Shut the GUI server down — the terminal that ran `omnilist gui` exits.
$('#shutdown-btn').addEventListener('click', async () => {
  if (!confirm('Shut down the omnilist GUI server? The page will stop responding.')) return;
  try {
    await api('POST', '/api/shutdown');
  } catch (e) { /* connection drops when the server dies — expected */ }
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-2);font-family:var(--font)">Server shut down. Run <code style="margin:0 4px">omnilist gui</code> in a terminal to start it again.</div>';
});
window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

init();
</script>
</body>
</html>
